<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<title>Weather</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eef4;
    --muted: #8b9bb4;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --border: #2d3a4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.4;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; text-align: center; }
  .search {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .current {
    text-align: center;
  }
  .temp { font-size: 4rem; font-weight: 300; line-height: 1; }
  .condition { font-size: 1.25rem; color: var(--muted); margin: 4px 0 12px; }
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    font-size: 0.95rem;
  }
  .detail { display: flex; justify-content: space-between; }
  .forecast { display: flex; flex-direction: column; gap: 8px; }
  .day {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .day:last-child { border-bottom: none; }
  .day-name { font-weight: 500; }
  .day-temps { text-align: right; }
  .high { font-weight: 600; }
  .low { color: var(--muted); margin-left: 8px; }
  .error { color: #ef4444; text-align: center; padding: 12px; }
  .loading { text-align: center; color: var(--muted); padding: 20px; }
  .attribution { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 20px; }
  .attribution a { color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <h1>Weather</h1>
  <div class="search">
    <input id="city" type="text" placeholder="City name (e.g. Salem, IL)" value="Salem, IL" autocomplete="off">
    <button id="searchBtn" onclick="search()">Search</button>
  </div>
  <div id="content"></div>
  <div class="attribution">Weather data by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a></div>
</div>

<script>
const weatherCodes = {
  0: "Clear",
  1: "Mainly clear",
  2: "Partly cloudy",
  3: "Overcast",
  45: "Fog",
  48: "Rime fog",
  51: "Light drizzle",
  53: "Drizzle",
  55: "Heavy drizzle",
  61: "Light rain",
  63: "Rain",
  65: "Heavy rain",
  71: "Light snow",
  73: "Snow",
  75: "Heavy snow",
  80: "Light showers",
  81: "Showers",
  82: "Heavy showers",
  95: "Thunderstorm",
  96: "Thunderstorm with hail",
  99: "Heavy thunderstorm with hail"
};

async function search() {
  const query = document.getElementById("city").value.trim();
  if (!query) return;

  const content = document.getElementById("content");
  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  content.innerHTML = '<div class="loading">Looking up location...</div>';

  try {
    // Geocode
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
    const geo = await geoRes.json();
    if (!geo.results || geo.results.length === 0) {
      content.innerHTML = '<div class="error">City not found</div>';
      return;
    }
    const place = geo.results[0];
    const { latitude, longitude, name, admin1, country } = place;
    const locationName = admin1 ? `${name}, ${admin1}` : `${name}, ${country}`;

    // Weather
    content.innerHTML = '<div class="loading">Fetching weather...</div>';
    const weatherRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=7`
    );
    const data = await weatherRes.json();

    const current = data.current;
    const daily = data.daily;
    const condition = weatherCodes[current.weather_code] || "Unknown";

    let html = `
      <div class="card current">
        <div style="font-size:1.1rem; margin-bottom:8px;">${locationName}</div>
        <div class="temp">${Math.round(current.temperature_2m)}°</div>
        <div class="condition">${condition}</div>
        <div class="details">
          <div class="detail"><span>Feels like</span><span>${Math.round(current.apparent_temperature)}°</span></div>
          <div class="detail"><span>Humidity</span><span>${current.relative_humidity_2m}%</span></div>
          <div class="detail"><span>Wind</span><span>${Math.round(current.wind_speed_10m)} mph</span></div>
          <div class="detail"><span>Precip</span><span>${current.precipitation.toFixed(2)} in</span></div>
        </div>
      </div>
      <div class="card">
        <div style="font-weight:600; margin-bottom:8px;">7-Day Forecast</div>
        <div class="forecast">
    `;

    for (let i = 0; i < daily.time.length; i++) {
      const date = new Date(daily.time[i]);
      const dayName = i === 0 ? "Today" : date.toLocaleDateString("en-US", { weekday: "short" });
      const high = Math.round(daily.temperature_2m_max[i]);
      const low = Math.round(daily.temperature_2m_min[i]);
      const dayCond = weatherCodes[daily.weather_code[i]] || "";
      html += `
        <div class="day">
          <div class="day-name">${dayName}</div>
          <div style="color:var(--muted); font-size:0.9rem;">${dayCond}</div>
          <div class="day-temps"><span class="high">${high}°</span><span class="low">${low}°</span></div>
        </div>
      `;
    }
    html += `</div></div>`;
    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = '<div class="error">Something went wrong. Try again.</div>';
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

// Load default on page load
search();

// Enter key support
document.getElementById("city").addEventListener("keypress", (e) => {
  if (e.key === "Enter") search();
});
</script>
</body>
</html>
